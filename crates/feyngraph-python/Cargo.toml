[package]
name = "feyngraph-python"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib"]
doc = false
name = "feyngraph"

[dependencies]
drawing = { package = "feyngraph-drawing", path = "../feyngraph-drawing", optional = true }
feyngraph-core = { path = "../feyngraph-core", features = ["_internal_api", "rayon"] }
feyngraph-model = { path = "../feyngraph-model" }
feyngraph-qgraf = { path = "../feyngraph-qgraf" }
util = { package = "feyngraph-util", path = "../feyngraph-util" }

either = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
pyo3 = {
  workspace = true,
  features = [
    "abi3-py310",
    "auto-initialize",
    "either",
    "indexmap",
    "multiple-pymethods",
    "experimental-inspect"
  ]
}
pyo3-ffi = { workspace = true }
pyo3-log = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
pretty_assertions = { workspace = true }
test-log = { workspace = true }

[features]
default = ["drawing"]
drawing = ["dep:drawing"]
